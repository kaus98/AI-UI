<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fafafa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI Chat">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI Chat Interface</title>
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <!-- Segoe UI is a system font; no external import needed -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <!-- EasyMDE -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=8">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
</head>

<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Chat history">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn" aria-label="Create new chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    New Chat
                </button>
            </div>
            <div class="chat-list" id="chat-list" role="navigation" aria-label="Chat history">
                <div class="search-bar" style="padding: 0 0.5rem 0.5rem;">
                    <input type="text" id="chat-search" placeholder="Search chats..." aria-label="Search chats">
                </div>
                <div class="folder-list" id="folder-list" role="tablist" aria-label="Chat folders">
                    <span class="folder-pill active" data-folder="All" role="tab" aria-selected="true" tabindex="0">All</span>
                    <span class="folder-pill" data-folder="General" role="tab" aria-selected="false" tabindex="0">General</span>
                    <span class="folder-pill" data-folder="Work" role="tab" aria-selected="false" tabindex="0">Work</span>
                    <span class="folder-pill" data-folder="Personal" role="tab" aria-selected="false" tabindex="0">Personal</span>
                    <span class="folder-pill" data-folder="Archive" role="tab" aria-selected="false" tabindex="0">Archive</span>
                </div>
                <div id="chat-items" style="display:flex; flex-direction:column; gap:2px;" role="list" aria-label="Chat list">
                    <!-- Chat items will be injected here -->
                </div>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <section class="main-content" id="main-content">
            <!-- Sidebar / Header -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="logo">
                        <img src="/favicon.png" alt="AI" class="logo-icon"
                            style="width: 32px; height: 32px; border-radius: 6px;">
                        <div class="endpoint-selector-wrapper">
                            <select id="endpoint-select" class="endpoint-select" aria-label="Select endpoint">
                                <option value="" disabled>Select Endpoint</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <select id="preset-select" class="model-select" style="max-width:160px;" aria-label="Select agent">
                        <option value="">No Agent</option>
                    </select>
                    <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                            </path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                    <select id="model-select" class="model-select" aria-label="Select model">
                        <option value="" disabled selected>Loading models...</option>
                    </select>
                    <button id="refresh-models-btn" class="icon-btn" title="Refresh Models" aria-label="Refresh models">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                    <div class="status-indicator" id="status-indicator" title="Connected" aria-label="Connected"></div>
                </div>
            </header>

            <!-- Chat Area -->
            <main class="chat-area" id="chat-container" role="log" aria-live="polite" aria-label="Chat messages">
                <div class="welcome-message">
                    <h2>Welcome</h2>
                    <p>Select a model and start chatting.</p>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="input-area">
                <div class="input-container">
                    <!-- Image Preview Area -->
                    <div id="image-preview-container" class="image-preview-container hidden"></div>

                    <!-- Hidden File Input -->
                    <input type="file" id="image-upload" accept="image/*" multiple style="display: none;" aria-label="Upload images">

                    <div class="input-row">
                        <textarea id="user-input" placeholder="Type a message..." aria-label="Message input" rows="1"></textarea>

                        <!-- Attach Button -->
                        <button id="attach-btn" title="Attach Image" aria-label="Attach image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                </path>
                            </svg>
                        </button>

                        <div id="tools-bar" class="tools-bar"></div>

                        <button id="stop-btn" class="stop-btn" type="button" title="Stop generating" hidden aria-label="Stop generating">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <rect x="6" y="6" width="12" height="12" rx="2" />
                            </svg>
                        </button>
                        <button id="send-btn" aria-label="Send message">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </footer>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <button class="settings-section-header" data-target="endpoints-section">
                        <h3>Endpoints</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="endpoints-section" class="settings-section-content">
                        <div id="endpoints-list" class="endpoints-list">
                            <!-- Endpoints injected here -->
                        </div>
                        <button id="add-endpoint-btn" class="secondary-btn">+ Add Endpoint</button>
                    </div>
                </div>

                <!-- Edit Form (Hidden by default) -->
                <div id="endpoint-form" class="endpoint-form hidden">
                    <h4>Edit Endpoint</h4>
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label>Preset</label>
                        <select id="edit-preset"
                            style="width: 100%; padding: 0.75rem; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px;">
                            <option value="custom">Custom</option>
                            <option value="openai">OpenAI</option>
                            <option value="google">Google Gemini</option>
                            <option value="groq">Groq</option>
                            <option value="nvidia">NVIDIA</option>
                            <option value="lm-studio">LM Studio (localhost:1234)</option>
                            <option value="ollama">Ollama (localhost:11434)</option>
                            <option value="localai">LocalAI (localhost:8080)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="edit-name" placeholder="e.g. OpenAI">
                    </div>
                    <div class="form-group">
                        <label>Base URL</label>
                        <input type="text" id="edit-url" placeholder="https://api.openai.com/v1">
                    </div>

                    <div class="form-group">
                        <label>Default Model</label>
                        <input type="text" id="edit-default-model" placeholder="e.g. gpt-4o-mini (optional)">
                    </div>
                    <div class="form-group form-inline" style="display:flex; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="edit-stream" checked>
                        <label for="edit-stream" style="margin:0;">Enable streaming for this endpoint</label>
                    </div>
                    <div class="form-group">
                        <label>Input cost per 1M tokens</label>
                        <input type="number" id="edit-input-cost" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>Output cost per 1M tokens</label>
                        <input type="number" id="edit-output-cost" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>System Prompt</label>
                        <textarea id="edit-system-prompt" rows="3" placeholder="Optional default system prompt for this endpoint..."
                            style="width: 100%; padding: 0.75rem; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; resize: vertical;"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Auth Type</label>
                        <select id="edit-auth-type"
                            style="width: 100%; padding: 0.75rem; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px;">
                            <option value="api-key">API Key</option>
                            <option value="oauth2">OAuth 2.0 (Client Credentials)</option>
                        </select>
                    </div>

                    <!-- API Key Input -->
                    <div id="auth-api-key" class="form-group">
                        <label>API Key</label>
                        <input type="password" id="edit-key" placeholder="sk-...">
                    </div>

                    <!-- OAuth inputs -->
                    <div id="auth-oauth" class="hidden">
                        <div class="form-group">
                            <label>Token URL</label>
                            <input type="text" id="edit-token-url" placeholder="https://oauth.example.com/token">
                        </div>
                        <div class="form-group">
                            <label>Client ID</label>
                            <input type="text" id="edit-client-id" placeholder="Client ID">
                        </div>
                        <div class="form-group">
                            <label>Client Secret</label>
                            <input type="password" id="edit-client-secret" placeholder="Client Secret">
                        </div>
                        <div class="form-group">
                            <label>Scope (Optional)</label>
                            <input type="text" id="edit-scope" placeholder="api://default">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button id="cancel-edit-btn" class="ghost-btn">Cancel</button>
                        <button id="save-endpoint-btn" class="primary-btn">Save</button>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="settings-section-header" data-target="agents-section">
                        <h3>Agents</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="agents-section" class="settings-section-content">
                        <div id="presets-list" class="endpoints-list">
                            <!-- Agents injected here -->
                        </div>
                        <button id="add-preset-btn" class="secondary-btn">+ Add Agent</button>
                    </div>
                </div>

                <div id="preset-form" class="endpoint-form hidden">
                    <h4 id="preset-form-title">Add Agent</h4>
                    <input type="hidden" id="preset-edit-id">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="preset-name" placeholder="e.g. Coding Assistant">
                    </div>
                    <div class="form-group">
                        <label>Endpoint</label>
                        <select id="preset-endpoint" style="width:100%; padding:0.75rem; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-primary); border-radius:6px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Model ID</label>
                        <input type="text" id="preset-model" placeholder="Optional model id">
                    </div>
                    <div class="form-group">
                        <label>System Prompt</label>
                        <textarea id="preset-prompt" rows="3" placeholder="System prompt..."
                            style="width:100%; padding:0.75rem; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-primary); border-radius:6px; resize:vertical;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma separated)</label>
                        <input type="text" id="preset-tags" placeholder="coding, python">
                    </div>
                    <div class="form-actions">
                        <button id="cancel-preset-btn" class="ghost-btn">Cancel</button>
                        <button id="save-preset-btn" class="primary-btn">Save</button>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="settings-section-header" data-target="tools-section">
                        <h3>Tools</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="tools-section" class="settings-section-content">
                        <div id="settings-tools-list" class="endpoints-list">
                            <!-- Tools injected here -->
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="settings-section-header" data-target="search-section">
                        <h3>Search Engine</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="search-section" class="settings-section-content">
                        <div class="form-group">
                            <label>Search Engine</label>
                            <select id="search-engine-select" style="width:100%; padding:0.75rem; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-primary); border-radius:6px;">
                                <option value="auto">Auto (random fallback)</option>
                                <option value="duckduckgo">DuckDuckGo</option>
                                <option value="bing">Bing</option>
                                <option value="yahoo">Yahoo</option>
                                <option value="startpage">Startpage</option>
                            </select>
                        </div>
                        <div class="form-actions" style="margin-top:0.5rem;">
                            <button id="save-search-engine-btn" class="primary-btn">Save Search Engine</button>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="settings-section-header" data-target="proxy-section">
                        <h3>CORS Proxy (for localhost models)</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="proxy-section" class="settings-section-content">
                        <p style="font-size:0.75rem; color:var(--text-secondary); margin:0 0 0.5rem 0;">
                            Configure a CORS proxy to access localhost models. Use your Cloudflare Worker URL or local proxy like http://localhost:8080/
                        </p>
                        <div class="form-group">
                            <label>Proxy Base URL</label>
                            <input type="text" id="proxy-base-url" placeholder="https://aiui-proxy.YOUR_SUBDOMAIN.workers.dev">
                        </div>
                        <div class="form-actions" style="margin-top:0.5rem;">
                            <button id="save-proxy-btn" class="primary-btn">Save Proxy URL</button>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <button class="settings-section-header" data-target="data-section">
                        <h3>Data</h3>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="data-section" class="settings-section-content">
                        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                            <button id="export-chats-btn" class="secondary-btn">Export Chats</button>
                            <button id="import-chats-btn" class="secondary-btn">Import Chats</button>
                            <input type="file" id="import-chats-input" accept="application/json,.json" style="display:none;">
                            <button id="clear-cache-btn" class="danger-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                Clear All Caches
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js?v=16"></script>
</body>

</html>
